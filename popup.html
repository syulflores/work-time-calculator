<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="heading-row">
        <h2>Work Time Left</h2>
        <select id="mode" aria-label="Calculator mode"></select>
      </div>
      <span>Local calculator</span>
    </header>
    <div id="status" role="status">
      Enter your recorded hours and clock-in below.
    </div>
    <section class="settings">
      <label>Calculate for
        <select id="periodMode">
          <option value="week">Week</option>
          <option value="day">Day</option>
        </select>
      </label>
      <label id="weekStartSetting"
        >Week starts
        <select id="start">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="6">Saturday</option>
        </select></label
      ><label
        ><span id="targetLabel">Weekly target (hours)</span>
        <input
          id="target"
          type="number"
          min="1"
          max="168"
          step="0.25"
          value="40" /></label>
    </section>
    <section class="settings">
      <div class="clock-in-row">
        <input id="manualEnabled" type="checkbox"
          aria-label="Use this clock-in to estimate clock-out"
          title="Use this clock-in to estimate clock-out" />
        <label for="manualIn">Today clock-in</label>
        <input id="manualIn" type="time" />
      </div>
    </section>
    <section class="settings" id="manualSettings">
      <label>Recorded paid time (hours)
        <input id="manualHours" type="number" min="0" step="0.25" value="0" />
      </label>
    </section>
    <section class="settings">
      <label
        >Remaining unpaid break (minutes)
        <input id="break" type="number" min="0" max="480" step="1" value="0"
      /></label>
    </section>
    <div class="metrics">
      <div><small>Recorded paid time</small><strong id="worked">—</strong></div>
      <div>
        <small>Remaining to target</small><strong id="remaining">—</strong>
      </div>
      <div><small>Projected clock-out</small><strong id="out">—</strong></div>
    </div>
    <p id="period"></p>
    <p id="detail"></p>
    <button id="refresh">Refresh from Paychex</button>
    <p class="foot" id="foot">
      Read-only. The estimate is not an official payroll total. Keep Paychex
      open and signed in. This extension does not clock you in or out.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
