# Shell configuration for release.yml; retained by --update.
RELEASE_BRANCHES="main" # Space-separated exact branch names; "" allows all branches.
TAG_PREFIX="v" # Must match tag_prefix in .githooks/semver.conf.
RELEASE_TITLE_PREFIX="" # Optional text before the tag in release titles.
UPDATE_LATEST="true" # Set to "false" to leave GitHub's Latest selection alone.
